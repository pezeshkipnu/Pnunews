<!DOCTYPE html><html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اخبار پزشکی</title>
    <style>
        body { font-family: sans-serif; background: #f8f8f8; margin: 0; padding: 0; direction: rtl; }
        header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 20px; }
        .container { padding: 20px; }
        .section { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .section h2 { margin-top: 0; font-size: 18px; color: #333; }
        .news-item { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .news-item:last-child { border-bottom: none; }
        footer { text-align: center; padding: 15px; font-size: 14px; color: #777; }
    </style>
</head>
<body>
    <header>اخبار پزشکی</header><div class="container">

    <!-- بخش اخبار فوری -->
    <div class="section">
        <h2>📢 اخبار فوری</h2>
        <div class="news-item">نمونه خبر فوری شماره 1</div>
        <div class="news-item">نمونه خبر فوری شماره 2</div>
    </div>

    <!-- بخش اطلاعیه‌ها -->
    <div class="section">
        <h2>📌 اطلاعیه‌ها</h2>
        <div class="news-item">اطلاعیه جدید شماره 1</div>
        <div class="news-item">اطلاعیه جدید شماره 2</div>
    </div>

    <!-- بخش مقالات آموزشی -->
    <div class="section">
        <h2>📚 مطالب آموزشی</h2>
        <div class="news-item">مطلب آموزشی شماره 1</div>
        <div class="news-item">مطلب آموزشی شماره 2</div>
    </div>

</div>

<footer>تمام حقوق محفوظ است © 2025</footer>

</body>
</html>
